<body>
<div id="app" class="loading-shell"><div class="loading-card"><strong>Prep Studio</strong><span>Loading your private exam workspace…</span></div></div>
<noscript><div class="fatal">JavaScript is required to run this application.</div></noscript>
<input id="question-import" type="file" accept="application/json,.json" hidden><input id="backup-import" type="file" accept="application/json,.json" hidden>
<script>const MARKS_CORRECT = 1;
const MARKS_WRONG = -0.25;

function scoreAttempt(questions, answers = {}, grades = {}) {
  let correct = 0, wrong = 0, skipped = 0, descriptiveSubmitted = 0, descriptivePending = 0, score = 0;
  const rows = questions.map((question, index) => {
    const selected = answers[index];
    const isDescriptive = question.type === 'descriptive';
    const blank = selected === undefined || selected === null || String(selected).trim() === '';
    let status = 'Skipped';
    let awardedMarks = 0;
    if (isDescriptive) {
      if (blank) skipped += 1;
      else {
        descriptiveSubmitted += 1;
        const grade = grades[index];
        if (grade && Number.isFinite(Number(grade.score))) {
          awardedMarks = Math.max(0, Math.min(Number(question.marks || 0), Number(grade.score)));
          score += awardedMarks;
          status = 'Graded';
        } else {
          descriptivePending += 1;
          status = 'Pending Review';
        }
      }
    } else if (blank) skipped += 1;
    else if (Number(selected) === Number(question.answer)) {
      correct += 1;
      awardedMarks = Number(question.marks ?? MARKS_CORRECT);
      score += awardedMarks;
      status = 'Correct';
    } else {
      wrong += 1;
      awardedMarks = -Number(question.negativeMarks ?? Math.abs(MARKS_WRONG));
      score += awardedMarks;
      status = 'Wrong';
    }
    return { question, index, selected, status, awardedMarks, grade: grades[index] || null };
  });
  const objectiveAttempted = correct + wrong;
  return {
    correct, wrong, skipped, descriptiveSubmitted, descriptivePending,
    attempted: objectiveAttempted + descriptiveSubmitted,
    objectiveAttempted, total: questions.length,
    maxScore: Number(questions.reduce((sum, question) => sum + Number(question.marks || 0), 0).toFixed(2)),
    score: Number(score.toFixed(2)),
    accuracy: objectiveAttempted ? Math.round((correct / objectiveAttempted) * 100) : 0,
    rows,
  };
}

function aggregate(rows, keyFn) {
  const map = new Map();
  rows.forEach((row) => {
    const key = keyFn(row) || 'Uncategorized';
    if (!map.has(key)) map.set(key, { name: key, total: 0, correct: 0, wrong: 0, skipped: 0, pending: 0, graded: 0, activeMs: 0, score: 0, maxScore: 0 });
    const item = map.get(key);
    item.total += 1;
    if (row.status === 'Correct') item.correct += 1;
    else if (row.status === 'Wrong') item.wrong += 1;
    else if (row.status === 'Skipped') item.skipped += 1;
    else if (row.status === 'Pending Review') item.pending += 1;
    else if (row.status === 'Graded') item.graded += 1;
    item.score += Number(row.awardedMarks || 0);
    item.maxScore += Number(row.question.marks || 0);
    item.activeMs += row.activeMs || 0;
  });
  return [...map.values()].map((item) => ({
    ...item,
    attempted: item.correct + item.wrong + item.pending + item.graded,
    accuracy: item.correct + item.wrong ? Math.round((item.correct / (item.correct + item.wrong)) * 100) : 0,
    averageSeconds: item.total ? Math.round(item.activeMs / item.total / 1000) : 0,
  }));
}

function buildAnalytics({ questions, answers = {}, grades = {}, timeByQuestion = {}, visits = {}, answerChanges = {}, marked = {} }) {
  const score = scoreAttempt(questions, answers, grades);
  const rows = score.rows.map((row) => ({
    ...row,
    activeMs: timeByQuestion[row.index] || 0,
    activeSeconds: Math.round((timeByQuestion[row.index] || 0) / 1000),
    visits: visits[row.index] || 0,
    answerChanges: answerChanges[row.index] || 0,
    marked: Boolean(marked[row.index]),
    wordCount: row.question.type === 'descriptive' ? String(row.selected || '').trim().split(/\s+/).filter(Boolean).length : 0,
  }));
  const totalActiveMs = rows.reduce((sum, row) => sum + row.activeMs, 0);
  return {
    ...score, rows, totalActiveMs, totalActiveSeconds: Math.round(totalActiveMs / 1000),
    averageSeconds: rows.length ? Math.round(totalActiveMs / rows.length / 1000) : 0,
    bySubject: aggregate(rows, (row) => row.question.subject), byTopic: aggregate(rows, (row) => row.question.topic),
    slowest: [...rows].sort((a, b) => b.activeMs - a.activeMs).slice(0, Math.min(5, rows.length)),
    totalVisits: rows.reduce((sum, row) => sum + row.visits, 0), totalAnswerChanges: rows.reduce((sum, row) => sum + row.answerChanges, 0),
  };
}

function coachInsights(analytics) {
  const insights = [];
  if (analytics.objectiveAttempted) {
    if (analytics.accuracy < 70) insights.push('Accuracy is the first constraint. Reduce speculative attempts and verify the final step before saving.');
    else if (analytics.accuracy < 85) insights.push('Accuracy is workable but still leaks marks. Review each wrong answer before increasing speed.');
    else insights.push('Objective accuracy is strong. The next gain should come from selection and execution speed.');
  }
  if (analytics.descriptivePending) insights.push(`${analytics.descriptivePending} descriptive response${analytics.descriptivePending === 1 ? '' : 's'} await AI or manual review.`);
  const attemptRate = analytics.total ? analytics.attempted / analytics.total : 0;
  if (attemptRate < 0.7) insights.push('Attempt rate was below 70%. Bank direct questions first and return to longer items later.');
  if (analytics.totalAnswerChanges > Math.max(2, analytics.total * 0.2)) insights.push('Frequent answer changes may be costing time. Change an answer only when you can identify the original mistake.');
  if (analytics.averageSeconds > 90) insights.push('Average active time exceeded 90 seconds per item. Use a first-visit cap for objective questions.');
  const weak = analytics.byTopic.filter((topic) => topic.correct + topic.wrong >= 2).sort((a, b) => a.accuracy - b.accuracy)[0];
  if (weak && weak.accuracy < 70) insights.push(`${weak.name} is the clearest objective weak area (${weak.accuracy}% accuracy).`);
  const slow = analytics.slowest[0];
  if (slow && slow.question.type !== 'descriptive' && slow.activeSeconds > Math.max(120, analytics.averageSeconds * 2)) insights.push(`Question ${slow.index + 1} consumed ${slow.activeSeconds}s; review why you stayed instead of moving on.`);
  return insights.slice(0, 6);
}

function buildCoachPacket(attempt, analytics) {
  return {
    schemaVersion: 2, exam: attempt.title, completedAt: attempt.completedAt, isTestRun: Boolean(attempt.isTestRun),
    summary: { score: analytics.score, maxScore: analytics.maxScore, total: analytics.total, correct: analytics.correct, wrong: analytics.wrong, skipped: analytics.skipped, descriptivePending: analytics.descriptivePending, accuracy: analytics.accuracy, elapsedSeconds: attempt.elapsedSeconds, activeQuestionSeconds: analytics.totalActiveSeconds, answerChanges: analytics.totalAnswerChanges },
    subjectBreakdown: analytics.bySubject, topicBreakdown: analytics.byTopic,
    responses: analytics.rows.map((row) => ({
      number: row.index + 1, type: row.question.type || 'mcq', subject: row.question.subject, section: row.question.section, topic: row.question.topic,
      question: row.question.question,
      response: row.question.type === 'descriptive' ? (row.selected || null) : (row.selected === undefined || row.selected === null ? null : row.question.options[row.selected]),
      correctOption: row.question.type === 'descriptive' ? null : row.question.options[row.question.answer],
      modelAnswer: row.question.modelAnswer || '', rubric: row.question.rubric || [], wordLimit: row.question.wordLimit || 0,
      status: row.status, awardedMarks: row.awardedMarks, maximumMarks: row.question.marks, activeSeconds: row.activeSeconds, visits: row.visits, answerChanges: row.answerChanges, markedForReview: row.marked, explanation: row.question.explanation || '',
    })),
  };
}

function buildCoachPrompt(packet) {
  return `You are my evidence-based bank-exam performance coach. Analyze this objective and/or descriptive attempt. For descriptive responses, score against the supplied maximum marks and rubric, then give line-level improvements and a better outline. For objective responses, diagnose accuracy, question selection, time management and avoidable negative marking. Return: (1) score adjustment for descriptive items, (2) three most important patterns, (3) a three-session plan with measurable targets, and (4) decision rules for my next test. Do not infer weakness from a test run.\n\nATTEMPT_PACKET\n${JSON.stringify(packet, null, 2)}`;
}


const parallelRows = `Fourteen persons sit in two parallel rows of seven with equal spacing. In row 1, A, B, C, D, E, F and G face north. In row 2, P, Q, R, S, T, U and V face south. Each person in row 1 faces a person in row 2. D sits third to the right of G. The one who faces G sits immediately left of S. Only one person sits between S and P, who sits third to the right of T. T sits second to the left of the one facing C. As many persons sit between C and D as between P and R, who sits immediately right of U. Only two persons sit between A and E. F sits somewhere to the right of E and is not at an end. Q sits immediately right of the one who faces F.`;

const loanTable = `The table shows loan applications received by five branches and the percentage approved.\n\nBranch A: 120 applications, 75% approved\nBranch B: 150 applications, 80% approved\nBranch C: 180 applications, 70% approved\nBranch D: 210 applications, 60% approved\nBranch E: 240 applications, 90% approved`;

const q = (id, subject, topic, question, options, answer, explanation, extra = {}) => ({
  id, type: 'mcq', subject, section: subject, topic, question, options, answer, explanation,
  marks: 1, negativeMarks: 0.25, difficulty: 'Prelims', source: 'Starter bank', ...extra,

const SUBJECTS = ['Reasoning Ability', 'Quantitative Aptitude', 'English Language', 'General Awareness'];

function shuffleItems(items, enabled = true, random = () => crypto.getRandomValues(new Uint32Array(1))[0] / 4294967296) {
  const copy = [...items];
  if (!enabled) return copy;
  for (let i = copy.length - 1; i > 0; i -= 1) {
    const j = Math.floor(random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function shuffleQuestionSets(items, enabled = true, random = () => crypto.getRandomValues(new Uint32Array(1))[0] / 4294967296) {
  const copy = [...items];
  if (!enabled) return copy;
  const groups = [];
  const bySet = new Map();
  copy.forEach((item, index) => {
    const key = item.setId ? `set:${item.setId}` : `single:${index}`;
    if (!bySet.has(key)) {
      const group = [];
      bySet.set(key, group);
      groups.push(group);
    }
    bySet.get(key).push(item);
  });
  return shuffleItems(groups, true, random).flat();
}

function normalizeTable(table) {
  if (!table) return null;
  const caption = String(table.caption || '').trim();
  const headers = Array.isArray(table.headers) ? table.headers.map((cell) => String(cell ?? '')) : [];
  const rows = Array.isArray(table.rows) ? table.rows.map((row) => (Array.isArray(row) ? row.map((cell) => String(cell ?? '')) : [])) : [];
  if (!headers.length && !rows.length) return null;
  const cols = Math.max(headers.length, ...rows.map((row) => row.length), 0);
  if (!cols) return null;
  const pad = (cells) => [...cells, ...Array(Math.max(0, cols - cells.length)).fill('')];
  return { caption, headers: pad(headers), rows: rows.map(pad) };
}

function normalizeImage(image) {
  if (!image) return null;
  const src = String(image.src || image.url || image.data || '').trim();
  if (!src) return null;
  if (!/^(data:image\/(png|jpe?g|gif|webp|svg\+xml);base64,|https?:\/\/|\/|\.{1,2}\/)/i.test(src)) return null;
  return { src, alt: String(image.alt || image.caption || 'Question diagram').trim(), caption: String(image.caption || '').trim() };
}

function isCourseFormat(payload) {
  return payload?.questions && Array.isArray(payload.questions) && payload.questions.length > 0
    && (payload.course_title || payload.day || payload.sections)
    && payload.questions[0]?.options && typeof payload.questions[0].options === 'object' && !Array.isArray(payload.questions[0].options)
    && typeof payload.questions[0].correct_answer === 'string';
}

const COURSE_SUBJECTS = ['Quantitative Aptitude', 'Reasoning Ability', 'English Language', 'General Awareness', 'Computer Awareness', 'Banking Awareness'];

function inferCourseSubject(value) {
  const title = String(value || '');
  return COURSE_SUBJECTS.find((subject) => title.toLowerCase().includes(subject.toLowerCase())) || '';
}

function sharedSetSignature(question) {
  if (question.type === 'descriptive' || (!question.passage && !question.table && !question.image)) return '';
  return JSON.stringify([question.subject, question.topic, question.passage || '', question.table || null, question.image?.src || '']);
}

function signatureId(signature) {
  let hash = 0;
  for (let index = 0; index < signature.length; index += 1) hash = ((hash << 5) - hash + signature.charCodeAt(index)) | 0;
  return `SET-${Math.abs(hash).toString(36)}`;
}

function migrateStoredBank(items) {
  if (!Array.isArray(items)) return items;
  const migrated = items.map((question) => {
    const subject = inferCourseSubject(question.source || question.subject);
    return subject && (question.subject !== subject || question.section !== subject) ? { ...question, subject, section: subject } : question;
  });
  const counts = new Map();
  migrated.forEach((question) => { const signature = sharedSetSignature(question); if (signature) counts.set(signature, (counts.get(signature) || 0) + 1); });
  return migrated.map((question) => {
    if (question.setId) return question;
    const signature = sharedSetSignature(question);
    return signature && counts.get(signature) > 1 ? { ...question, setId: signatureId(signature) } : question;
  });
}

function convertCourseFormat(payload) {
  const sectionContexts = [];
  if (Array.isArray(payload.sections)) {
    payload.sections.forEach((section, sectionIndex) => {
      const range = String(section.question_range || '').match(/(\d+)\s*-\s*(\d+)/);
      if (!range) return;
      const ctx = { start: Number(range[1]), end: Number(range[2]), description: '', table: null, setId: `COURSE-${payload.day || '0'}-SET-${sectionIndex + 1}` };
      if (section.context?.description) ctx.description = String(section.context.description);
      if (Array.isArray(section.context?.table) && section.context.table.length > 0) {
        const firstRow = section.context.table[0];
        if (typeof firstRow === 'object' && !Array.isArray(firstRow)) {
          const headers = Object.keys(firstRow);
          ctx.table = { caption: section.section_name || '', headers, rows: section.context.table.map((row) => headers.map((key) => String(row[key] ?? ''))) };
        }
      }
      if (Array.isArray(section.context?.notes) && section.context.notes.length > 0) {
        ctx.description += (ctx.description ? '\n\n' : '') + section.context.notes.map(String).join('\n');
      }
      sectionContexts.push(ctx);
    });
  }

  const courseTitle = String(payload.course_title || '').replace(/\s*(bundle\s+pdf\s+course|pdf\s+course|course)\s*$/i, '').trim();
  const subject = inferCourseSubject(courseTitle) || 'Quantitative Aptitude';
  const idPrefix = courseTitle.replace(/\s+/g, '').slice(0, 3).toUpperCase() || subject.replace(/\s+/g, '').slice(0, 3).toUpperCase();
  const title = courseTitle ? `${courseTitle} — Day ${payload.day || ''}`.replace(/\s+/g, ' ').trim() : 'Imported Mock Test';

  const questions = payload.questions.map((item, index) => {
    const qNum = Number(item.question_number || index + 1);
    const optionsObj = item.options || {};
    const optionKeys = Object.keys(optionsObj).sort();
    const options = optionKeys.map((key) => String(optionsObj[key]).trim()).filter(Boolean);
    const correctLetter = String(item.correct_answer || '').trim().toLowerCase();
    const answerIndex = optionKeys.indexOf(correctLetter);
    const questionType = String(item.type || '').trim();
    const sectionCtx = sectionContexts.find((ctx) => qNum >= ctx.start && qNum <= ctx.end);
    const passage = sectionCtx?.description || '';
    const table = sectionCtx?.table || null;

    return {
      id: `${idPrefix}-D${payload.day || '0'}-Q${String(qNum).padStart(3, '0')}`,
      type: 'mcq',
      subject: subject,
      section: subject,
      topic: questionType || 'General',
      difficulty: 'Prelims',
      passage: passage,
      question: String(item.question || '').trim(),
      options,
      answer: answerIndex >= 0 ? answerIndex : 0,
      marks: 1,
      negativeMarks: 0.25,
      explanation: String(item.explanation || '').trim(),
      source: payload.course_title || 'Imported course JSON',
      ...(sectionCtx && (passage || table) ? { setId: sectionCtx.setId } : {}),
      ...(table ? { table } : {}),
    };
  });

  return { title, description: `Day ${payload.day || ''} — ${payload.total_questions || questions.length} questions`, questions };
}

function normalizeImportedBank(payload) {
  const source = Array.isArray(payload) ? payload : payload?.questions;
  if (!Array.isArray(source)) throw new Error('Expected a JSON array or an object with a questions array.');
  const ids = new Set();
  const normalized = source.map((item, index) => {
    const type = item.type === 'descriptive' ? 'descriptive' : 'mcq';
    const question = String(item.question || '').trim();
    const options = Array.isArray(item.options) ? item.options.map((option) => String(option).trim()).filter(Boolean) : [];
    const answer = type === 'mcq' ? Number(item.answer) : null;
    const id = String(item.id || `IMP-${Date.now()}-${index + 1}`);
    if (!question) throw new Error(`Question ${index + 1} has no question text.`);
    if (type === 'mcq' && (options.length < 2 || options.length > 6)) throw new Error(`Question ${index + 1} must have 2–6 options.`);
    if (type === 'mcq' && (!Number.isInteger(answer) || answer < 0 || answer >= options.length)) throw new Error(`Question ${index + 1} has an invalid zero-based answer index.`);
    if (ids.has(id)) throw new Error(`Duplicate question id: ${id}`);
    ids.add(id);
    const subject = String(item.subject || 'General Awareness').trim();
    const table = normalizeTable(item.table);
    const image = normalizeImage(item.image);
    return {
      id, type, subject, section: String(item.section || subject), topic: String(item.topic || 'Imported'), question,
      options: type === 'mcq' ? options : [], answer,
      explanation: String(item.explanation || ''), modelAnswer: String(item.modelAnswer || ''),
      rubric: Array.isArray(item.rubric) ? item.rubric.map(String) : [], wordLimit: Math.max(0, Number(item.wordLimit) || 0),
      passage: item.passage ? String(item.passage) : '', difficulty: String(item.difficulty || 'Prelims'),
      marks: Math.max(0, Number(item.marks) || (type === 'mcq' ? 1 : 10)),
      negativeMarks: Math.max(0, Number(item.negativeMarks) || (type === 'mcq' ? 0.25 : 0)),
      source: String(item.source || 'Imported JSON'),
      ...(String(item.setId || item.set_id || '').trim() ? { setId: String(item.setId || item.set_id).trim() } : {}),
      ...(table ? { table } : {}),
      ...(image ? { image } : {}),
    };
  });
  return migrateStoredBank(normalized);
}

function normalizeImportedTest(payload) {
  let source = payload?.test && typeof payload.test === 'object' ? payload.test : (payload?.title !== undefined ? payload : null);
  if (!source && isCourseFormat(payload)) {
    source = convertCourseFormat(payload);
  }
  if (!source) throw new Error('Expected a JSON object with a "test" wrapper, top-level test fields (title + questions), or a course format with sections and questions.');
  const title = String(source.title || source.name || '').trim();
  if (!title) throw new Error('The test needs a title.');
  const questions = normalizeImportedBank(source.questions || source.questionBank || []);
  if (!questions.length) throw new Error('The test contains no valid questions.');
  const descriptiveCount = questions.filter((question) => question.type === 'descriptive').length;
  const defaultMinutes = Math.max(5, Math.ceil((questions.length - descriptiveCount) * 0.75 + descriptiveCount * 20));
  return {
    title: title.slice(0, 120),
    description: String(source.description || '').trim().slice(0, 300),
    durationMinutes: Math.max(1, Math.min(600, Number(source.durationMinutes ?? source.minutes ?? defaultMinutes) || defaultMinutes)),
    shuffle: source.shuffle !== false,
    questions,
  };
}

    if (raw !== null) return JSON.parse(raw);
  } catch { /* localStorage can be unavailable in sandboxed previews */ }
  return memoryFallback.has(key) ? memoryFallback.get(key) : fallback;
}

function write(key, value) {
  memoryFallback.set(key, value);
  try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* continue in memory */ }
}

function remove(key) {
  memoryFallback.delete(key);
  try { localStorage.removeItem(key); } catch { /* continue in memory */ }
}

function sanitizeConfig(config) {
  if (!config) return null;
  const { apiKey, key, token, authorization, ...safe } = config;
  return safe;
}

function escapeHTML(value) {
  return String(value ?? '').replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
}

function renderInline(value) {
  return escapeHTML(value)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\*([^*]+)\*/g, '<em>$1</em>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
}

function cells(line) {
  let value = line.trim();
  if (value.startsWith('|')) value = value.slice(1);
  if (value.endsWith('|')) value = value.slice(0, -1);
  return value.split('|').map((cell) => cell.trim());
}

function renderMarkdown(value) {
  const lines = String(value || '').replace(/\r/g, '').split('\n');
  const out = [];

  for (let i = 0; i < lines.length;) {
    const line = lines[i];

    if (/^```/.test(line.trim())) {
      const language = line.trim().slice(3).trim();
      const code = [];
      i += 1;
      while (i < lines.length && !/^```/.test(lines[i].trim())) code.push(lines[i++]);
      if (i < lines.length) i += 1;
      out.push(`<pre><code${language ? ` data-language="${escapeHTML(language)}"` : ''}>${escapeHTML(code.join('\n'))}</code></pre>`);
      continue;
    }

    if (line.includes('|') && i + 1 < lines.length && /^\s*\|?\s*:?-{3,}/.test(lines[i + 1])) {
      const headers = cells(line);
      i += 2;
      const rows = [];
      while (i < lines.length && lines[i].includes('|') && lines[i].trim()) rows.push(cells(lines[i++]));
      out.push(`<div class="chat-table-wrap"><table><thead><tr>${headers.map((cell) => `<th>${renderInline(cell)}</th>`).join('')}</tr></thead><tbody>${rows.map((row) => `<tr>${headers.map((_, index) => `<td>${renderInline(row[index] || '')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`);
      continue;
    }

    if (/^#{1,4}\s+/.test(line)) {
      const level = Math.min(4, line.match(/^#+/)[0].length);
      out.push(`<h${level}>${renderInline(line.replace(/^#{1,4}\s+/, ''))}</h${level}>`);
      i += 1;
      continue;
    }

    if (/^\s*[-*]\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) items.push(`<li>${renderInline(lines[i++].replace(/^\s*[-*]\s+/, ''))}</li>`);
      out.push(`<ul>${items.join('')}</ul>`);
      continue;
    }

    if (/^\s*\d+[.)]\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) items.push(`<li>${renderInline(lines[i++].replace(/^\s*\d+[.)]\s+/, ''))}</li>`);
      out.push(`<ol>${items.join('')}</ol>`);
      continue;
    }

    if (!line.trim()) {
      i += 1;
      continue;
    }

    const paragraph = [line.trim()];
    i += 1;
    while (i < lines.length && lines[i].trim()
      && !/^(```|#{1,4}\s+|\s*[-*]\s+|\s*\d+[.)]\s+)/.test(lines[i])
      && !(lines[i].includes('|') && i + 1 < lines.length && /^\s*\|?\s*:?-{3,}/.test(lines[i + 1]))) {
      paragraph.push(lines[i++].trim());
    }
    out.push(`<p>${paragraph.map(renderInline).join('<br>')}</p>`);
  }

  return out.join('');
}


function reviewStatus(status) {
  if (status === 'Correct' || status === 'Graded') return { tone: 'correct', label: status };
  if (status === 'Wrong') return { tone: 'wrong', label: 'Incorrect' };
  if (status === 'Pending Review') return { tone: 'pending', label: status };
  return { tone: 'skipped', label: 'Skipped' };
}

function reviewOptionState(question, selected, optionIndex) {
  const correct = question.type !== 'descriptive' && Number(question.answer) === optionIndex;
  const chosen = selected !== undefined && selected !== null && Number(selected) === optionIndex;
  return {
    correct,
    chosen,
    wrongChoice: chosen && !correct,
    className: correct ? 'correct-choice' : (chosen ? 'wrong-choice' : ''),
    label: correct && chosen ? 'Your answer · Correct' : (correct ? 'Correct answer' : (chosen ? 'Your answer' : '')),
  };
}

function formatReviewDuration(seconds) {
  const safe = Math.max(0, Math.round(Number(seconds) || 0));
  if (safe < 60) return `${safe}s`;
  const minutes = Math.floor(safe / 60);
  const remainder = safe % 60;
  return `${minutes}m ${String(remainder).padStart(2, '0')}s`;
}


function positiveInteger(value, label, max) {
  const number = Number(value);
  if (!Number.isInteger(number) || number < 1 || number > max) throw new Error(`${label} must be between 1 and ${max}.`);
  return number;
}

function questionTypes(value) {
  if (value === 'both') return ['mcq', 'descriptive'];
  return [value === 'descriptive' ? 'descriptive' : 'mcq'];
}

function matchingMockQuestions(bank, { subject = '', topics = [], type = 'mcq', query = '' } = {}) {
  const allowedTypes = questionTypes(type);
  const selectedTopics = new Set(topics);
  const search = String(query).trim().toLowerCase();
  return bank.filter((question) => {
    if (subject && question.subject !== subject) return false;
    if (selectedTopics.size && !selectedTopics.has(question.topic)) return false;
    if (!allowedTypes.includes(question.type || 'mcq')) return false;
    if (search && !`${question.question} ${question.topic} ${question.subject}`.toLowerCase().includes(search)) return false;
    return true;
  });
}

function buildRandomMockConfig({ title, subject, topics, type, count, durationMinutes, shuffle = true }, bank) {
  const cleanTitle = String(title || '').trim();
  if (!cleanTitle) throw new Error('Enter a test name.');
  if (!String(subject || '').trim()) throw new Error('Choose a subject.');
  if (!Array.isArray(topics) || !topics.length) throw new Error('Choose at least one chapter.');
  const pool = matchingMockQuestions(bank, { subject, topics, type });
  if (!pool.length) throw new Error('No questions match those chapters.');
  const questionCount = positiveInteger(count, 'Question count', pool.length);
  return {
    title: cleanTitle.slice(0, 120),
    description: `Random practice from ${topics.length} selected chapter${topics.length === 1 ? '' : 's'}.`,
    subjects: [subject],
    topics: [...topics],
    types: questionTypes(type),
    count: questionCount,
    durationMinutes: positiveInteger(durationMinutes, 'Duration', 600),
    selectionStrategy: 'random',
    shuffle: Boolean(shuffle),
  };
}

function buildSelectedMockConfig({ title, questionIds, durationMinutes, shuffle = true }, bank) {
  const cleanTitle = String(title || '').trim();
  if (!cleanTitle) throw new Error('Enter a test name.');
  const availableIds = new Set(bank.map((question) => question.id));
  const uniqueIds = [...new Set(Array.isArray(questionIds) ? questionIds : [])].filter((id) => availableIds.has(id));
  if (!uniqueIds.length) throw new Error('Select at least one question.');
  const selected = bank.filter((question) => uniqueIds.includes(question.id));
  return {
    title: cleanTitle.slice(0, 120),
    description: `Created from ${uniqueIds.length} questions you selected.`,
    questionIds: uniqueIds,
    subjects: [...new Set(selected.map((question) => question.subject))],
    topics: [...new Set(selected.map((question) => question.topic))],
    types: [...new Set(selected.map((question) => question.type || 'mcq'))],
    count: uniqueIds.length,
    durationMinutes: positiveInteger(durationMinutes, 'Duration', 600),
    shuffle: Boolean(shuffle),
  };
}


function buildSubjectTrends(attempts) {
  const bySubject = new Map();
  const ordered = (Array.isArray(attempts) ? attempts : [])
    .filter((attempt) => attempt && !attempt.isTestRun && attempt.analytics)
    .sort((a, b) => new Date(a.completedAt || 0) - new Date(b.completedAt || 0));

  ordered.forEach((attempt) => {
    const subjects = Array.isArray(attempt.analytics.bySubject) ? attempt.analytics.bySubject : [];
    subjects.forEach((subject) => {
      if (!subject?.name) return;
      if (!bySubject.has(subject.name)) bySubject.set(subject.name, []);
      bySubject.get(subject.name).push({
        attemptId: attempt.id,
        title: attempt.title,
        completedAt: attempt.completedAt,
        accuracy: Number(subject.accuracy || 0),
        averageSeconds: Number(subject.averageSeconds || 0),
        attempted: Number(subject.attempted || 0),
        correct: Number(subject.correct || 0),
        wrong: Number(subject.wrong || 0),
        skipped: Number(subject.skipped || 0),
        score: Number(subject.score || 0),
        maxScore: Number(subject.maxScore || 0),
      });
    });
  });

  return [...bySubject.entries()]
    .map(([subject, points]) => ({ subject, points }))
    .sort((a, b) => a.subject.localeCompare(b.subject));
}

function summarizeSubjectTrend(points) {
  const safe = Array.isArray(points) ? points : [];
  const latest = safe.at(-1) || null;
  const previous = safe.at(-2) || null;
  return {
    attempts: safe.length,
    latestAccuracy: latest?.accuracy ?? 0,
    accuracyChange: latest && previous ? latest.accuracy - previous.accuracy : 0,
    latestAverageSeconds: latest?.averageSeconds ?? 0,
    averageAccuracy: safe.length ? Math.round(safe.reduce((sum, point) => sum + point.accuracy, 0) / safe.length) : 0,
  };
}

function buildMistakeNotebook(attempts, state = {}) {
  const entries = new Map();
  const ordered = (Array.isArray(attempts) ? attempts : [])
    .filter((attempt) => attempt && !attempt.isTestRun && Array.isArray(attempt.analytics?.rows))
    .sort((a, b) => new Date(a.completedAt || 0) - new Date(b.completedAt || 0));

  ordered.forEach((attempt) => {
    attempt.analytics.rows.forEach((row) => {
      const question = row?.question;
      if (!question?.id || question.type === 'descriptive') return;
      const status = row.status;
      let entry = entries.get(question.id);
      if (!entry && !['Wrong', 'Skipped'].includes(status)) return;
      if (!entry) entry = { questionId: question.id, question, wrongCount: 0, skippedCount: 0, correctCount: 0, latestStatus: status, lastMistakeAt: attempt.completedAt, latestActiveSeconds: 0 };
      entry.question = question;
      entry.latestStatus = status;
      entry.latestActiveSeconds = Number(row.activeSeconds || 0);
      if (status === 'Wrong') { entry.wrongCount += 1; entry.lastMistakeAt = attempt.completedAt; }
      else if (status === 'Skipped') { entry.skippedCount += 1; entry.lastMistakeAt = attempt.completedAt; }
      else if (status === 'Correct') entry.correctCount += 1;
      entries.set(question.id, entry);
    });
  });

  return [...entries.values()].map((entry) => ({
    ...entry,
    mastered: Boolean(state[entry.questionId]?.mastered),
    note: String(state[entry.questionId]?.note || ''),
    improved: entry.latestStatus === 'Correct',
  })).sort((a, b) => Number(a.mastered) - Number(b.mastered) || new Date(b.lastMistakeAt || 0) - new Date(a.lastMistakeAt || 0));
}


const DEFAULTS = {
  openai: { label: 'Chat Completions compatible', baseUrl: '', model: '', authMode: 'bearer', authHeader: 'Authorization', authPrefix: 'Bearer ' },
  anthropic: { label: 'Messages compatible', baseUrl: '', model: '', authMode: 'header', authHeader: 'x-api-key', authPrefix: '' },
  gemini: { label: 'Generate Content compatible', baseUrl: '', model: '', authMode: 'header', authHeader: 'x-goog-api-key', authPrefix: '' },
};

function providerDefaults(provider) {
  return { ...(DEFAULTS[provider] || DEFAULTS.openai) };
}

function inferProvider() {
  return 'openai';
}

function validateAIConfig(config) {
  if (!['openai', 'anthropic', 'gemini'].includes(config.provider)) throw new Error('Choose the API format used by your provider.');
  const url = new URL(String(config.baseUrl || '').trim());
  if (url.protocol !== 'https:' && url.hostname !== 'localhost' && url.hostname !== '127.0.0.1') throw new Error('Use an HTTPS endpoint, or localhost for a trusted local model.');
  if (!String(config.model || '').trim()) throw new Error('Enter the model ID required by your provider.');
  const authMode = ['bearer', 'header', 'none', 'apiKey'].includes(config.authMode) ? config.authMode : 'bearer';
  return {
    ...config,
    authMode: authMode === 'apiKey' ? (config.provider === 'openai' ? 'bearer' : 'header') : authMode,
    authHeader: String(config.authHeader || providerDefaults(config.provider).authHeader || 'Authorization').trim(),
    authPrefix: String(config.authPrefix ?? providerDefaults(config.provider).authPrefix ?? ''),
    baseUrl: url.toString().replace(/\/+$/, ''),
    modelsUrl: String(config.modelsUrl || '').trim().replace(/\/+$/, ''),
    model: config.model.trim(),
  };
}

function modelsEndpoint(config) {
  if (config.modelsUrl) return config.modelsUrl;
  if (config.provider === 'gemini') return `${config.baseUrl.replace(/\/+$/, '')}/models`;
  if (config.provider === 'anthropic') return config.baseUrl.replace(/\/v1\/messages$/, '/v1/models');
  return config.baseUrl.replace(/\/chat\/completions$/, '').replace(/\/+$/, '') + '/models';
}

function authHeaders(config, apiKey) {
  if (!apiKey || config.authMode === 'none') return {};
  if (config.provider === 'anthropic') return { 'x-api-key': apiKey, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' };
  if (config.provider === 'gemini') return { 'x-goog-api-key': apiKey };
  return { [config.authHeader || 'Authorization']: `${config.authPrefix ?? 'Bearer '}${apiKey}` };
}

async function discoverModels({ config, apiKey, timeoutMs = 30000 }) {
  const safeConfig = validateAIConfig(config);
  if (!apiKey && safeConfig.authMode !== 'none') throw new Error('Enter an API key before fetching models, or choose no authentication for a trusted local endpoint.');
  const headers = { Accept: 'application/json', ...authHeaders(safeConfig, apiKey) };
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), timeoutMs);
  try {
    const response = await fetch(modelsEndpoint(safeConfig), { headers, signal: controller.signal });
    const payload = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(payload?.error?.message || `Model discovery failed (${response.status}). Enter a model manually if this provider does not expose /models.`);
    const raw = safeConfig.provider === 'gemini' ? payload.models : payload.data;
    const models = (Array.isArray(raw) ? raw : []).map((item) => String(item?.id || item?.name || '')).map((name) => name.replace(/^models\//, '')).filter(Boolean);
    if (!models.length) throw new Error('The provider returned no model names. Enter the model manually.');
    return [...new Set(models)].sort();
  } catch (error) {
    if (error.name === 'AbortError') throw new Error('Model discovery timed out.');
    if (error instanceof TypeError) throw new Error('The browser could not fetch models. Check the URL and the provider’s CORS policy.');
    throw error;
  } finally { clearTimeout(timeout); }
}

function bytesToBase64(buffer) {
  const bytes = new Uint8Array(buffer);
  let binary = '';
  const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk) binary += String.fromCharCode(...bytes.subarray(i, i + chunk));
  return btoa(binary);
}

async function fileToAttachment(file) {
  if (!file) return null;
  if (file.size > 12 * 1024 * 1024) throw new Error('Choose a file smaller than 12 MB for direct browser upload.');
  const mimeType = file.type || (file.name.endsWith('.pdf') ? 'application/pdf' : 'text/plain');
  if (mimeType.startsWith('text/') || file.name.match(/\.(md|csv|json)$/i)) {
    return { name: file.name, mimeType, text: await file.text() };
  }
  return { name: file.name, mimeType, base64: bytesToBase64(await file.arrayBuffer()) };
}

function geminiEndpoint(config) {
  return `${config.baseUrl}/models/${encodeURIComponent(config.model)}:generateContent`;
}

function openAIEndpoint(config) {
  return config.baseUrl.endsWith('/chat/completions') ? config.baseUrl : `${config.baseUrl}/chat/completions`;
}

async function requestGemini(config, apiKey, prompt, attachment, signal) {
  const parts = [{ text: prompt }];
  if (attachment?.text) parts.push({ text: `\n\nATTACHED FILE: ${attachment.name}\n${attachment.text}` });
  if (attachment?.base64) parts.push({ inlineData: { mimeType: attachment.mimeType, data: attachment.base64 } });
  const response = await fetch(geminiEndpoint(config), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', ...authHeaders(config, apiKey) },
    body: JSON.stringify({ contents: [{ role: 'user', parts }], generationConfig: { temperature: config.temperature ?? 0.2 } }),
    signal,
  });
  const payload = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(payload?.error?.message || `Generate Content request failed (${response.status}).`);
  const text = payload?.candidates?.[0]?.content?.parts?.map((part) => part.text || '').join('\n').trim();
  if (!text) throw new Error('The Generate Content endpoint returned no text. Check the model ID and platform settings.');
  return text;
}

async function requestOpenAI(config, apiKey, prompt, attachment, signal) {
  if (attachment?.base64 && attachment.mimeType === 'application/pdf') throw new Error('Direct PDF upload is not standardized for Chat Completions endpoints. Extract the PDF to text or use a compatible multimodal endpoint.');
  let content = prompt;
  if (attachment?.text) content += `\n\nATTACHED FILE: ${attachment.name}\n${attachment.text}`;
  if (attachment?.base64 && attachment.mimeType.startsWith('image/')) content = [
    { type: 'text', text: prompt },
    { type: 'image_url', image_url: { url: `data:${attachment.mimeType};base64,${attachment.base64}` } },
  ];
  const headers = { 'Content-Type': 'application/json', ...authHeaders(config, apiKey) };
  const response = await fetch(openAIEndpoint(config), {
    method: 'POST',
    headers,
    body: JSON.stringify({ model: config.model, messages: [{ role: 'user', content }], temperature: config.temperature ?? 0.2 }),
    signal,
  });
  const payload = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(payload?.error?.message || `Model request failed (${response.status}).`);
  const text = payload?.choices?.[0]?.message?.content;
  if (typeof text !== 'string' || !text.trim()) throw new Error('The endpoint returned no compatible text response.');
  return text.trim();
}

function anthropicEndpoint(config) {
  return config.baseUrl.endsWith('/v1/messages') ? config.baseUrl : `${config.baseUrl}/v1/messages`;
}

async function requestAnthropic(config, apiKey, prompt, attachment, signal) {
  if (attachment?.base64 && attachment.mimeType === 'application/pdf') throw new Error('Direct PDF upload is not enabled for the Messages adapter. Extract the PDF to text or use a compatible multimodal endpoint.');
  let content = [{ type: 'text', text: prompt }];
  if (attachment?.text) content.push({ type: 'text', text: `\n\nATTACHED FILE: ${attachment.name}\n${attachment.text}` });
  if (attachment?.base64 && attachment.mimeType.startsWith('image/')) content.push({ type: 'image', source: { type: 'base64', media_type: attachment.mimeType, data: attachment.base64 } });
  const response = await fetch(anthropicEndpoint(config), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', ...authHeaders(config, apiKey) },
    body: JSON.stringify({ model: config.model, max_tokens: Number(config.maxTokens || 4096), messages: [{ role: 'user', content }] }),
    signal,
  });
  const payload = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(payload?.error?.message || `Messages request failed (${response.status}).`);
  const text = Array.isArray(payload?.content) ? payload.content.map((block) => block?.text || '').join('\n').trim() : '';
  if (!text) throw new Error('The Messages endpoint returned no text. Check the model ID and account access.');
  return text;
}

async function callAI({ config, apiKey, prompt, attachment = null, timeoutMs = 90000 }) {
  const safeConfig = validateAIConfig(config);
  if (!apiKey && safeConfig.authMode !== 'none') throw new Error('Enter an API key, or choose no authentication for a trusted local endpoint.');
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), timeoutMs);
  try {
    if (safeConfig.provider === 'gemini') return await requestGemini(safeConfig, apiKey, prompt, attachment, controller.signal);
    if (safeConfig.provider === 'anthropic') return await requestAnthropic(safeConfig, apiKey, prompt, attachment, controller.signal);
    return await requestOpenAI(safeConfig, apiKey, prompt, attachment, controller.signal);
  } catch (error) {
    if (error.name === 'AbortError') throw new Error('The model request timed out.');
    if (error instanceof TypeError) throw new Error('The browser could not reach the endpoint. Check the URL, internet connection and the provider’s CORS policy.');
    throw error;
  } finally {
    clearTimeout(timeout);
  }
}

function parseJSONResponse(text) {
  const cleaned = String(text).trim().replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/i, '');
  const start = Math.min(...['[', '{'].map((char) => {
    const index = cleaned.indexOf(char);
    return index < 0 ? Infinity : index;
  }));
  if (!Number.isFinite(start)) throw new Error('The model did not return JSON.');
  const candidate = cleaned.slice(start);
  try { return JSON.parse(candidate); } catch {
    const objectEnd = candidate.lastIndexOf('}');
    const arrayEnd = candidate.lastIndexOf(']');
    const end = Math.max(objectEnd, arrayEnd);
    if (end < 0) throw new Error('The model returned incomplete JSON.');
    try { return JSON.parse(candidate.slice(0, end + 1)); }
    catch { throw new Error('The model response could not be parsed as valid JSON. Ask it to return JSON only.'); }
  }
}

function paperConversionPrompt({ defaultSubject = 'Reasoning Ability', instructions = '' } = {}) {

async function importMockTest(){const status=document.querySelector('#mock-import-status');try{const file=document.querySelector('#mock-import-file').files[0];if(!file)throw new Error('Choose a JSON mock test file first.');if(file.size>20*1024*1024)throw new Error('Choose a JSON file smaller than 20 MB.');const payload=JSON.parse(await file.text());const imported=normalizeImportedTest(payload);const overrideMinutes=Number(document.querySelector('#mock-import-minutes')?.value)||0;if(overrideMinutes>0)imported.durationMinutes=Math.min(600,overrideMinutes);const map=new Map(bank.map(q=>[q.id,q]));imported.questions.forEach(q=>map.set(q.id,q));bank=[...map.values()];const questionIds=imported.questions.map(q=>q.id);const test={id:uid('test'),title:imported.title,description:imported.description||`Imported from ${file.name}.`,questionIds,subjects:unique(imported.questions.map(q=>q.subject)),types:unique(imported.questions.map(q=>q.type)),count:questionIds.length,durationMinutes:imported.durationMinutes,sourceFile:file.name,needsReview:false,shuffle:imported.shuffle};customTests=[test,...customTests];storage.saveBank(bank);storage.saveTests(customTests);status.textContent=`Imported "${test.title}" with ${questionIds.length} questions (${formatTime(test.durationMinutes*60)}). Opening Practice…`;showToast('Mock test imported and ready to start.','good');setTimeout(()=>navigate('tests'),900);}catch(error){status.textContent=error.message;showToast(error.message,'warn');}}

function materializeTest(test){const shouldShuffle=test.shuffle===undefined?settings.shuffle:test.shuffle!==false;if(test.questionIds?.length){const map=new Map(bank.map(q=>[q.id,q]));const fixedQuestions=test.questionIds.map(id=>map.get(id)).filter(Boolean);return randomizeSets(fixedQuestions,shouldShuffle);}let pool=bank.filter(q=>(!test.subjects?.length||test.subjects.includes(q.subject))&&(!test.topics?.length||test.topics.includes(q.topic))&&(!test.types?.length||test.types.includes(q.type||'mcq')));const count=Math.min(Number(test.count)||pool.length,pool.length);if(test.selectionStrategy!=='balanced'){const picked=randomizeSets(pool,true).slice(0,count);return shouldShuffle?picked:picked.sort((a,b)=>pool.indexOf(a)-pool.indexOf(b));}const groups=[...new Map(pool.map(q=>[q.topic,[]])).entries()];pool.forEach(q=>groups.find(([topic])=>topic===q.topic)[1].push(q));groups.forEach(group=>{group[1]=randomize(group[1],true);});const picked=[];let cursor=0;while(picked.length<count&&groups.some(group=>group[1].length)){const group=groups[cursor%groups.length];if(group[1].length)picked.push(group[1].shift());cursor+=1;}return shouldShuffle?randomizeSets(picked,true):picked;}

function saveManualQuestion(event){event.preventDefault();const f=new FormData(event.currentTarget);const type=f.get('type');const options=String(f.get('options')||'').split('\n').map(s=>s.trim()).filter(Boolean);let answer=null;if(type==='mcq'){const raw=String(f.get('answer')||'').trim().toUpperCase();answer=/^[A-F]$/.test(raw)?raw.charCodeAt(0)-65:Number(raw);if(options.length<2||!Number.isInteger(answer)||answer<0||answer>=options.length)return showToast('Objective questions need valid options and a correct answer.','warn');}const id=String(f.get('id')||'').trim()||uid('manual');const subject=String(f.get('subject')).trim();const tableLines=String(f.get('tableText')||'').split('\n').map(s=>s.trim()).filter(Boolean);let table=null;if(tableLines.length){const hasHeader=tableLines.length>1;const caption=tableLines[0].includes('|')?'':tableLines[0];const dataLines=caption?tableLines.slice(1):tableLines;const rows=dataLines.map(line=>line.split('|').map(cell=>cell.trim()));if(rows.length)table={caption,headers:hasHeader?rows[0]:[],rows:hasHeader?rows.slice(1):rows};}const imageSrc=String(f.get('imageSrc')||'').trim();const image=imageSrc?{src:imageSrc,alt:String(f.get('imageCaption')||'Question diagram').trim(),caption:String(f.get('imageCaption')||'').trim()}:null;const item={id,type,subject,section:String(f.get('section')||subject).trim(),topic:String(f.get('topic')).trim(),passage:String(f.get('passage')||''),question:String(f.get('question')).trim(),options:type==='mcq'?options:[],answer,marks:Number(f.get('marks'))||0,negativeMarks:type==='mcq'?(Number(f.get('negativeMarks'))||0):0,difficulty:String(f.get('difficulty')||'Practice'),explanation:String(f.get('explanation')||''),modelAnswer:String(f.get('modelAnswer')||''),wordLimit:Number(f.get('wordLimit'))||0,rubric:String(f.get('rubric')||'').split('\n').map(s=>s.trim()).filter(Boolean),source:'Manual',...(String(f.get('setId')||'').trim()?{setId:String(f.get('setId')).trim()}:{}),...(table?{table}:{}),...(image?{image}:{})};bank=[item,...bank.filter(q=>q.id!==id)];storage.saveBank(bank);showToast('Question saved.','good');renderBank();}

async function generateQuestions(event){const status=document.querySelector('#draft-status');try{const prompt=generationPrompt({subject:document.querySelector('#gen-subject').value,topic:document.querySelector('#gen-topic').value,difficulty:document.querySelector('#gen-difficulty').value,type:document.querySelector('#gen-type').value,count:Number(document.querySelector('#gen-count').value)});const text=await runAI(prompt,null,event.currentTarget,status);aiDraftQuestions=normalizeImportedBank(parseJSONResponse(text));document.querySelector('#ai-draft').value=JSON.stringify({questions:aiDraftQuestions},null,2);status.textContent=`Generated and validated ${aiDraftQuestions.length} questions. Review every answer before importing.`;}catch(error){status.textContent=error.message;}}
function importAIDraft(){try{aiDraftQuestions=normalizeImportedBank(JSON.parse(document.querySelector('#ai-draft').value));const map=new Map(bank.map(q=>[q.id,q]));aiDraftQuestions.forEach(q=>map.set(q.id,q));bank=[...map.values()];storage.saveBank(bank);showToast(`Imported ${aiDraftQuestions.length} AI-staged questions. Verify their keys before serious practice.`,'good');aiDraftQuestions=[];renderAIStudio();}catch(error){showToast(error.message,'warn');}}
async function analyseAttempt(event){const status=document.querySelector('#analysis-output');try{const attempt=attempts.find(a=>a.id===document.querySelector('#analysis-attempt').value);if(!attempt)throw new Error('Choose an attempt.');const text=await runAI(buildCoachPrompt(buildCoachPacket(attempt,attempt.analytics)),null,event.currentTarget,status);status.value=text;status.dataset.attemptId=attempt.id;}catch(error){status.value=error.message;}}
async function gradeDescriptiveAttempt(event){const output=document.querySelector('#analysis-output');try{const attempt=attempts.find(a=>a.id===document.querySelector('#analysis-attempt').value);if(!attempt)throw new Error('Choose an attempt.');if(!attempt.raw)throw new Error('This legacy attempt has no raw responses to grade.');const pending=attempt.analytics.rows.filter(row=>row.question.type==='descriptive'&&row.status==='Pending Review');if(!pending.length)throw new Error('This attempt has no ungraded descriptive responses.');const packet=buildCoachPacket(attempt,attempt.analytics);const prompt=`Grade only the descriptive responses in this attempt. Apply each supplied rubric and maximum mark. Return JSON only: {"grades":[{"number":1,"score":0,"feedback":"specific feedback"}],"overallFeedback":"concise summary"}. Never award more than maximumMarks.\n\n${JSON.stringify(packet)}`;const text=await runAI(prompt,null,event.currentTarget,output);const parsed=parseJSONResponse(text);if(!Array.isArray(parsed.grades))throw new Error('The model returned no grades array.');const grades={...(attempt.grades||{})};parsed.grades.forEach(item=>{const index=Number(item.number)-1;const row=attempt.analytics.rows[index];if(row?.question.type==='descriptive')grades[index]={score:Math.max(0,Math.min(Number(row.question.marks||0),Number(item.score)||0)),feedback:String(item.feedback||'')};});const analytics=buildAnalytics({...attempt.raw,grades});attempts=attempts.map(a=>a.id===attempt.id?{...a,grades,analytics,aiNotes:String(parsed.overallFeedback||a.aiNotes||'')}:a);storage.saveAttempts(attempts);output.value=`Descriptive grading saved. Updated score: ${analytics.score}/${analytics.maxScore}.\n\n${parsed.overallFeedback||''}`;output.dataset.attemptId=attempt.id;}catch(error){output.value=error.message;}}
function saveAIAnalysis(){const output=document.querySelector('#analysis-output');const id=output.dataset.attemptId||document.querySelector('#analysis-attempt').value;if(!id)return showToast('Analyse or select an attempt first.','warn');attempts=attempts.map(a=>a.id===id?{...a,aiNotes:output.value}:a);storage.saveAttempts(attempts);showToast('AI analysis saved to history.','good');}

function mistakeEntries(){return buildMistakeNotebook(attempts,mistakeState);}
function filteredMistakeEntries(){const subject=document.querySelector('#mistake-subject')?.value||'';const topic=document.querySelector('#mistake-topic')?.value||'';const status=document.querySelector('#mistake-status')?.value||'active';const query=(document.querySelector('#mistake-search')?.value||'').toLowerCase();return mistakeEntries().filter(entry=>(!subject||entry.question.subject===subject)&&(!topic||entry.question.topic===topic)&&(!query||`${entry.question.question} ${entry.question.topic}`.toLowerCase().includes(query))&&(status==='all'||(status==='active'&&!entry.mastered)||(status==='mastered'&&entry.mastered)||(status==='repeated'&&entry.wrongCount+entry.skippedCount>1)||(status==='improved'&&entry.improved)));}
function renderMistakes(){const entries=mistakeEntries();const active=entries.filter(entry=>!entry.mastered);const subjects=unique(entries.map(entry=>entry.question.subject)).sort();const topics=unique(entries.map(entry=>entry.question.topic)).sort();shell('Mistake Notebook',`<section class="mistake-hero"><div><span class="eyebrow">Subject improvement</span><h2>Turn mistakes into your next practice test</h2><p>Wrong and skipped questions appear here automatically. Review the answer, mark it mastered, or create a retry mock.</p></div><button class="btn primary" data-action="select-all-active-mistakes">Select active mistakes</button></section><section class="metric-grid"><div class="metric"><small>Active mistakes</small><b>${active.length}</b></div><div class="metric"><small>Repeated mistakes</small><b>${entries.filter(entry=>entry.wrongCount+entry.skippedCount>1&&!entry.mastered).length}</b></div><div class="metric"><small>Improved later</small><b>${entries.filter(entry=>entry.improved).length}</b></div><div class="metric"><small>Mastered</small><b>${entries.filter(entry=>entry.mastered).length}</b></div></section><section class="card"><div class="card-head"><h2>Your questions</h2><div class="toolbar"><select class="input" id="mistake-subject"><option value="">All subjects</option>${subjects.map(subject=>`<option>${escapeHTML(subject)}</option>`).join('')}</select><select class="input" id="mistake-topic"><option value="">All chapters</option>${topics.map(topic=>`<option>${escapeHTML(topic)}</option>`).join('')}</select><select class="input" id="mistake-status"><option value="active">Needs work</option><option value="repeated">Repeated mistakes</option><option value="improved">Correct in a later test</option><option value="mastered">Mastered</option><option value="all">All</option></select><input class="input" id="mistake-search" placeholder="Search question"></div></div><div class="card-body"><div class="picker-toolbar"><b id="mistake-selected-count">0 questions selected</b><div><button class="btn small" data-action="select-visible-mistakes">Select visible</button> <button class="btn small" data-action="clear-mistake-selection">Clear</button></div></div><div id="mistake-list" class="mistake-list"></div></div></section><section class="card retry-builder"><div class="card-head"><h2>Create a retry test</h2></div><div class="card-body"><div class="builder-grid"><div class="field"><label>Test name</label><input id="retry-title" value="Mistake Retry Test"></div><div class="field"><label>Time in minutes</label><input id="retry-minutes" type="number" min="1" max="600" value="${settings.defaultMinutes}"></div><label class="builder-check"><input id="retry-shuffle" type="checkbox" checked> Mix question order</label></div><div class="builder-footer"><span id="retry-status" class="status"></span><button class="btn primary" data-action="create-retry-test">Create retry test</button></div></div></section>`);renderMistakeList();bindMistakes();}
function renderMistakeList(){const target=document.querySelector('#mistake-list');if(!target)return;const availableIds=new Set(bank.map(question=>question.id));const entries=filteredMistakeEntries();target.innerHTML=entries.length?entries.map(entry=>{const q=entry.question;const available=availableIds.has(q.id);const answer=q.options?.[q.answer];const stateLabel=entry.mastered?'Mastered':entry.improved?'Improved later':entry.wrongCount+entry.skippedCount>1?'Repeated mistake':'Needs work';return`<article class="mistake-item ${entry.mastered?'mastered':''}"><div class="mistake-select"><input type="checkbox" data-mistake-question="${q.id}" ${mistakeQuestionIds.has(q.id)?'checked':''} ${available?'':'disabled'}></div><div class="mistake-main"><div class="mistake-head"><div><span class="chip">${escapeHTML(q.subject)}</span> <span class="chip">${escapeHTML(q.topic)}</span> <span class="mistake-state">${stateLabel}</span></div><small>${entry.wrongCount} wrong · ${entry.skippedCount} skipped · last time ${entry.latestActiveSeconds}s</small></div><p>${escapeHTML(q.question)}</p><details><summary>Show correct answer and explanation</summary><div class="mistake-answer"><b>Correct answer:</b> ${q.answer===null?'Manual review':`${String.fromCharCode(65+Number(q.answer))}. ${escapeHTML(answer||'')}`}<br>${q.explanation?`<b>Explanation:</b> ${escapeHTML(q.explanation)}`:'No explanation saved.'}</div></details><input class="mistake-note" data-mistake-note="${q.id}" value="${escapeHTML(entry.note)}" placeholder="Add a short note, e.g. forgot ratio formula"></div><button class="btn small ${entry.mastered?'':'primary'}" data-toggle-mastered="${q.id}">${entry.mastered?'Mark as needs work':'Mark mastered'}</button></article>`;}).join(''):'<div class="empty">No questions match these filters. Complete a test to build your mistake notebook.</div>';target.querySelectorAll('[data-mistake-question]').forEach(input=>input.addEventListener('change',()=>{input.checked?mistakeQuestionIds.add(input.dataset.mistakeQuestion):mistakeQuestionIds.delete(input.dataset.mistakeQuestion);updateMistakeSelectedCount();}));target.querySelectorAll('[data-toggle-mastered]').forEach(button=>button.addEventListener('click',()=>{const id=button.dataset.toggleMastered;mistakeState[id]={...(mistakeState[id]||{}),mastered:!mistakeState[id]?.mastered};storage.saveMistakeState(mistakeState);renderMistakeList();}));target.querySelectorAll('[data-mistake-note]').forEach(input=>input.addEventListener('change',()=>{const id=input.dataset.mistakeNote;mistakeState[id]={...(mistakeState[id]||{}),note:input.value.trim()};storage.saveMistakeState(mistakeState);}));updateMistakeSelectedCount();}
function updateMistakeSelectedCount(){const target=document.querySelector('#mistake-selected-count');if(target)target.textContent=`${mistakeQuestionIds.size} question${mistakeQuestionIds.size===1?'':'s'} selected`;}
function createRetryTest(){try{const config=buildSelectedMockConfig({title:document.querySelector('#retry-title').value,questionIds:[...mistakeQuestionIds],durationMinutes:document.querySelector('#retry-minutes').value,shuffle:document.querySelector('#retry-shuffle').checked},bank);const test={id:uid('test'),...config,description:`Targeted retry from your mistake notebook (${config.questionIds.length} questions).`};customTests=[test,...customTests];storage.saveTests(customTests);mistakeQuestionIds.clear();showToast('Retry test created in Practice.','good');navigate('tests');}catch(error){document.querySelector('#retry-status').textContent=error.message;showToast(error.message,'warn');}}
function bindMistakes(){['mistake-subject','mistake-topic','mistake-status','mistake-search'].forEach(id=>document.querySelector(`#${id}`).addEventListener('input',renderMistakeList));document.querySelector('[data-action="select-visible-mistakes"]').addEventListener('click',()=>{const available=new Set(bank.map(question=>question.id));filteredMistakeEntries().filter(entry=>!entry.mastered&&available.has(entry.questionId)).forEach(entry=>mistakeQuestionIds.add(entry.questionId));renderMistakeList();});document.querySelector('[data-action="select-all-active-mistakes"]').addEventListener('click',()=>{const available=new Set(bank.map(question=>question.id));mistakeEntries().filter(entry=>!entry.mastered&&available.has(entry.questionId)).forEach(entry=>mistakeQuestionIds.add(entry.questionId));renderMistakeList();document.querySelector('#mistake-list').scrollIntoView({behavior:'smooth'});});document.querySelector('[data-action="clear-mistake-selection"]').addEventListener('click',()=>{mistakeQuestionIds.clear();renderMistakeList();});document.querySelector('[data-action="create-retry-test"]').addEventListener('click',createRetryTest);}

function trendChart(points){if(!points.length)return'<div class="empty">Complete a subject test to start your trend.</div>';const recent=points.slice(-12);const width=760,height=230,left=42,right=18,top=20,bottom=38;const x=index=>recent.length===1?(left+width-right)/2:left+(index*(width-left-right)/(recent.length-1));const y=value=>top+((100-Math.max(0,Math.min(100,value)))*(height-top-bottom)/100);const line=recent.map((point,index)=>`${x(index)},${y(point.accuracy)}`).join(' ');return`<div class="trend-chart"><svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Accuracy trend over ${recent.length} attempts">${[0,25,50,75,100].map(value=>`<line x1="${left}" y1="${y(value)}" x2="${width-right}" y2="${y(value)}" class="trend-grid"/><text x="${left-8}" y="${y(value)+4}" text-anchor="end">${value}%</text>`).join('')}<polyline points="${line}" class="trend-line"/>${recent.map((point,index)=>`<circle cx="${x(index)}" cy="${y(point.accuracy)}" r="5" class="trend-dot"><title>${escapeHTML(point.title)}: ${point.accuracy}% accuracy, ${point.averageSeconds}s average</title></circle><text x="${x(index)}" y="${height-12}" text-anchor="middle">${index+1}</text>`).join('')}</svg></div>`;}
function renderSubjectTrend(subject){const target=document.querySelector('#trend-panel');if(!target)return;const trend=buildSubjectTrends(attempts).find(item=>item.subject===subject);const points=trend?.points||[];const summary=summarizeSubjectTrend(points);const change=summary.accuracyChange;target.innerHTML=`<div class="trend-metrics"><div><small>Latest accuracy</small><b>${summary.latestAccuracy}%</b></div><div><small>Change from previous</small><b class="${change>0?'ok':change<0?'bad':''}">${change>0?'+':''}${change}%</b></div><div><small>Latest average time</small><b>${summary.latestAverageSeconds}s</b></div><div><small>Subject attempts</small><b>${summary.attempts}</b></div></div>${trendChart(points)}${points.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Attempt</th><th>Accuracy</th><th>Correct / Wrong</th><th>Average time</th><th>Date</th></tr></thead><tbody>${[...points].reverse().slice(0,8).map(point=>`<tr><td>${escapeHTML(point.title)}</td><td><b>${point.accuracy}%</b></td><td>${point.correct} / ${point.wrong}</td><td>${point.averageSeconds}s</td><td>${new Date(point.completedAt).toLocaleDateString()}</td></tr>`).join('')}</tbody></table></div>`:''}`;}
function renderHistory(){const genuine=attempts.filter(a=>!a.isTestRun);const summary=analyticsSummary();const trends=buildSubjectTrends(attempts);const defaultSubject=trends.find(item=>item.subject==='Quantitative Aptitude')?.subject||trends[0]?.subject||'';shell('History',`<section class="metric-grid"><div class="metric"><small>Total attempts</small><b>${attempts.length}</b></div><div class="metric"><small>Genuine attempts</small><b>${genuine.length}</b></div><div class="metric"><small>Objective accuracy</small><b>${summary.accuracy}%</b></div><div class="metric"><small>Active practice</small><b>${formatTime(summary.active)}</b></div></section><section class="card trend-card"><div class="card-head"><div><h2>Subject performance trend</h2><small class="muted">Track accuracy and speed across your practice sessions.</small></div><select class="input" id="trend-subject">${trends.length?trends.map(item=>`<option ${item.subject===defaultSubject?'selected':''}>${escapeHTML(item.subject)}</option>`).join(''):'<option value="">No subject data yet</option>'}</select></div><div class="card-body" id="trend-panel"></div></section><section class="card" style="margin-top:16px"><div class="card-head"><h2>Attempt history</h2><div><button class="btn small" data-action="export-history">Export</button> <button class="btn small danger" data-action="clear-history">Delete all</button></div></div><div class="card-body">${attempts.length?attemptTable(attempts):'<div class="empty">No attempts saved.</div>'}</div></section>`);bindAttemptLinks();renderSubjectTrend(defaultSubject);document.querySelector('#trend-subject').addEventListener('change',event=>renderSubjectTrend(event.target.value));document.querySelector('[data-action="export-history"]').addEventListener('click',()=>downloadJSON('attempt-history.json',{attempts}));document.querySelector('[data-action="clear-history"]').addEventListener('click',()=>{if(confirm('Permanently delete all local attempt history?')){attempts=[];storage.clearAttempts();renderHistory();}});}

function openAttempt(id){const attempt=attempts.find(a=>a.id===id);if(!attempt)return;currentAttempt=attempt;reviewQuestionIndex=0;renderAttemptReview();}
function attemptReviewRows(){return currentAttempt?.analytics?.rows||[];}
function attemptReviewSections(){return unique(attemptReviewRows().map(row=>row.question.section||row.question.subject));}
function attemptReviewIndices(section){return attemptReviewRows().map((row,index)=>(row.question.section||row.question.subject)===section?index:-1).filter(index=>index>=0);}
function renderAttemptReview(){
  const rows=attemptReviewRows();
  const row=rows[reviewQuestionIndex];
  if(!row)return renderAttempt();
  const q=row.question;
  const result=reviewStatus(row.status);
  const section=q.section||q.subject;
  const indices=attemptReviewIndices(section);
  const tabs=attemptReviewSections().map(name=>`<button class="section-tab ${name===section?'active':''}" data-review-section="${escapeHTML(name)}">${escapeHTML(name)}</button>`).join('');
  const palette=indices.map(index=>{const item=rows[index];const status=reviewStatus(item.status);return`<button class="qn review-${status.tone} ${index===reviewQuestionIndex?'current':''}" data-review-question="${index}" title="Question ${index+1}: ${status.label}">${index+1}</button>`;}).join('');
  let response='';
  if(q.type==='descriptive'){
    response=`<div class="review-written"><h3>Your response</h3><div>${escapeHTML(row.selected||'No response submitted.').replace(/\n/g,'<br>')}</div></div>${row.grade?.feedback?`<div class="review-explanation"><b>Grader feedback</b><p>${escapeHTML(row.grade.feedback)}</p></div>`:''}${q.modelAnswer?`<div class="review-explanation"><b>Model answer / key points</b><p>${escapeHTML(q.modelAnswer)}</p></div>`:''}`;
  }else{
    response=`<div class="review-options">${q.options.map((option,index)=>{const state=reviewOptionState(q,row.selected,index);return`<div class="review-option ${state.className}"><span class="review-radio">${state.chosen?'●':'○'}</span><span><b>${String.fromCharCode(65+index)}.</b> ${escapeHTML(option)}</span>${state.label?`<em>${escapeHTML(state.label)}</em>`:''}</div>`;}).join('')}</div><div class="answer-summary"><span>Your answer: <b>${row.selected===undefined||row.selected===null?'Not answered':`${String.fromCharCode(65+Number(row.selected))}. ${escapeHTML(q.options[row.selected]||'')}`}</b></span><span>Correct answer: <b>${String.fromCharCode(65+Number(q.answer))}. ${escapeHTML(q.options[q.answer]||'')}</b></span></div>${q.explanation?`<div class="review-explanation"><b>Explanation</b><p>${escapeHTML(q.explanation).replace(/\n/g,'<br>')}</p></div>`:''}`;
  }
  const counts=rows.reduce((acc,item)=>{acc[reviewStatus(item.status).tone]+=1;return acc;},{correct:0,wrong:0,skipped:0,pending:0});
  document.body.classList.remove('tutor-view');
  app.innerHTML=`<main class="cbt review-cbt"><header class="cbt-head"><div class="exam-title"><div class="exam-seal">✓</div><div><b>${escapeHTML(currentAttempt.title)}</b><small>Completed mock review · ${new Date(currentAttempt.completedAt).toLocaleString()}</small></div></div><div class="clock review-clock"><span>Time on this question</span><strong>${formatReviewDuration(row.activeSeconds)}</strong></div></header><nav class="section-tabs">${tabs}</nav><div class="workspace"><section class="question-pane"><div class="q-meta review-meta"><b>Question No. ${reviewQuestionIndex+1}</b><span class="review-status ${result.tone}">${escapeHTML(result.label)}</span><span>Marks awarded: <b>${row.awardedMarks??0}</b> / ${q.marks??0}</span><span>${escapeHTML(q.subject)} · ${escapeHTML(q.topic)}</span></div><div class="q-content">${renderQuestionMedia(q)}<div class="question-text">${escapeHTML(q.question)}</div>${response}</div><div class="exam-actions review-actions"><button class="btn" data-review-prev ${reviewQuestionIndex===0?'disabled':''}>Previous</button><div class="review-telemetry"><span>Active time <b>${formatReviewDuration(row.activeSeconds)}</b></span><span>Visits <b>${row.visits||0}</b></span><span>Answer changes <b>${row.answerChanges||0}</b></span>${row.marked?'<span>Marked for review</span>':''}</div><button class="btn primary" data-review-next ${reviewQuestionIndex===rows.length-1?'disabled':''}>Next</button></div></section><aside class="side"><div class="review-score"><small>Final score</small><b>${currentAttempt.analytics.score} / ${currentAttempt.analytics.maxScore??currentAttempt.analytics.total}</b><span>${currentAttempt.analytics.accuracy}% accuracy</span></div><div class="palette-head">Answer Review</div><div class="palette-body"><h4>${escapeHTML(section)}</h4><div class="q-grid">${palette}</div><div class="review-legend"><span><i class="correct"></i>Correct (${counts.correct})</span><span><i class="wrong"></i>Incorrect (${counts.wrong})</span><span><i class="skipped"></i>Skipped (${counts.skipped})</span>${counts.pending?`<span><i class="pending"></i>Pending (${counts.pending})</span>`:''}</div></div></aside></div><footer class="exam-foot"><div class="button-group"><button class="btn small" data-action="review-summary">Results summary</button><button class="btn small" data-view="history">Back to History</button></div><span class="muted">Responses are read-only in review mode.</span></footer></main>`;
  bindAttemptReview();
}
function bindAttemptReview(){document.querySelectorAll('[data-review-question]').forEach(button=>button.addEventListener('click',()=>{reviewQuestionIndex=Number(button.dataset.reviewQuestion);renderAttemptReview();}));document.querySelectorAll('[data-review-section]').forEach(button=>button.addEventListener('click',()=>{reviewQuestionIndex=attemptReviewIndices(button.dataset.reviewSection)[0];renderAttemptReview();}));document.querySelector('[data-review-prev]').addEventListener('click',()=>{reviewQuestionIndex=Math.max(0,reviewQuestionIndex-1);renderAttemptReview();});document.querySelector('[data-review-next]').addEventListener('click',()=>{reviewQuestionIndex=Math.min(attemptReviewRows().length-1,reviewQuestionIndex+1);renderAttemptReview();});document.querySelector('[data-action="review-summary"]').addEventListener('click',renderAttempt);document.querySelector('[data-view="history"]').addEventListener('click',()=>navigate('history'));}

function renderAttempt(){const a=currentAttempt;const an=a.analytics;if(!an)return showToast('This legacy attempt has incomplete analytics.','warn');view='history';shell('Attempt Review',`<div class="results-head"><div><h2>${escapeHTML(a.title)}</h2><span class="muted">${new Date(a.completedAt).toLocaleString()} · elapsed ${formatTime(a.elapsedSeconds)} · active ${formatTime(an.totalActiveSeconds)}</span></div><div class="score-big"><b>${an.score}</b> / ${an.maxScore??an.total}</div></div><section class="stats"><div class="stat"><small>Correct</small><b class="ok">${an.correct}</b></div><div class="stat"><small>Wrong</small><b class="bad">${an.wrong}</b></div><div class="stat"><small>Skipped</small><b class="skip">${an.skipped}</b></div><div class="stat"><small>Accuracy</small><b>${an.accuracy}%</b></div><div class="stat"><small>Descriptive pending</small><b class="pending">${an.descriptivePending||0}</b></div></section><section class="insights"><b>Offline coaching</b>${coachInsights(an).map(x=>`<div class="insight">• ${escapeHTML(x)}</div>`).join('')}<div class="toolbar" style="margin-top:10px"><button class="btn primary" data-action="review-answers">Review answers</button><label><input id="attempt-test-run" type="checkbox" ${a.isTestRun?'checked':''}> UI test</label><button class="btn primary" data-action="copy-coach">Copy AI coaching prompt</button><button class="btn" data-action="download-attempt">Download packet</button></div><span id="attempt-status" class="status"></span></section><div class="table-wrap"><table class="table"><thead><tr><th>Q</th><th>Type</th><th>Topic</th><th>Status</th><th>Response / key</th><th>Time</th><th>Visits</th><th></th></tr></thead><tbody>${an.rows.map(row=>`<tr><td>${row.index+1}</td><td>${row.question.type||'mcq'}</td><td>${escapeHTML(row.question.topic)}</td><td class="${statusClass(row.status)}">${row.status}</td><td>${row.question.type==='descriptive'?`${wordCount(row.selected)} words`: `${row.selected===undefined?'—':String.fromCharCode(65+Number(row.selected))} / ${String.fromCharCode(65+Number(row.question.answer))}`}</td><td>${row.activeSeconds}s</td><td>${row.visits}</td><td>${row.question.type==='descriptive'&&row.status!=='Skipped'?`<button class="btn small" data-grade="${row.index}">Grade</button>`:''}</td></tr>`).join('')}</tbody></table></div><section class="card" style="margin-top:16px"><div class="card-head"><h2>Saved AI feedback</h2></div><div class="card-body"><textarea id="attempt-notes" class="feedback">${escapeHTML(a.aiNotes||'')}</textarea><button class="btn primary" data-action="save-attempt-notes" style="margin-top:8px">Save feedback</button></div></section><button class="btn" data-view="history" style="margin-top:15px">Back to History</button>`);bindAttemptView();}
function bindAttemptView(){document.querySelector('[data-action="review-answers"]').addEventListener('click',()=>{reviewQuestionIndex=0;renderAttemptReview();});document.querySelector('#attempt-test-run').addEventListener('change',(e)=>updateAttempt({isTestRun:e.target.checked}));document.querySelector('[data-action="copy-coach"]').addEventListener('click',copyAttemptPrompt);document.querySelector('[data-action="download-attempt"]').addEventListener('click',()=>downloadJSON(`attempt-${currentAttempt.id}.json`,buildCoachPacket(currentAttempt,currentAttempt.analytics)));document.querySelector('[data-action="save-attempt-notes"]').addEventListener('click',()=>{updateAttempt({aiNotes:document.querySelector('#attempt-notes').value});showToast('Feedback saved.','good');});document.querySelectorAll('[data-grade]').forEach(b=>b.addEventListener('click',()=>showGradeModal(Number(b.dataset.grade))));}

function showGradeModal(index){const row=currentAttempt.analytics.rows[index];openModal(`<div class="modal-head"><span>Grade descriptive response</span><button class="btn small" data-close>Close</button></div><div class="modal-body"><p><b>${escapeHTML(row.question.question)}</b></p><div class="notice">Maximum marks: ${row.question.marks}. Word count: ${wordCount(row.selected)}.</div><p style="white-space:pre-wrap">${escapeHTML(row.selected)}</p><div class="field"><label>Marks awarded</label><input id="grade-score" type="number" min="0" max="${row.question.marks}" step="0.5" value="${row.grade?.score||0}"></div><div class="field"><label>Feedback</label><textarea id="grade-feedback">${escapeHTML(row.grade?.feedback||'')}</textarea></div></div><div class="modal-actions"><button class="btn" data-close>Cancel</button><button class="btn primary" id="save-grade">Save grade</button></div>`);document.querySelector('#save-grade').addEventListener('click',()=>{const grades={...(currentAttempt.grades||{}),[index]:{score:Number(document.querySelector('#grade-score').value),feedback:document.querySelector('#grade-feedback').value}};const raw=currentAttempt.raw;if(!raw)return showToast('Raw response data is unavailable for this legacy attempt.','warn');const analytics=buildAnalytics({...raw,grades});updateAttempt({grades,analytics});closeModal({resume:false});renderAttempt();});}

function pdfToMockPrompt(){return`Convert the attached exam PDF into a JSON mock test for the Prep Studio app.

IMPORTANT OUTPUT RULES
- Return JSON only. Do not add an explanation or Markdown code block.
- Read every question and answer carefully.
- Do not guess a missing answer. Leave out a question if its correct answer is not available.
- Keep all numbers, options, tables and answer keys exactly as shown in the PDF.

USE THIS EXACT STRUCTURE
{
  "test": {
    "title": "Name of the mock test",
    "description": "Short description",
    "durationMinutes": 20,
    "shuffle": true,
    "questions": [
      {
        "id": "Q001",
        "type": "mcq",
        "subject": "Quantitative Aptitude",
        "section": "Quantitative Aptitude",
        "topic": "Data Interpretation",
        "setId": "DI-SET-01",
        "difficulty": "Prelims",
        "passage": "Directions or shared information",
        "table": {
          "caption": "Table title",
          "headers": ["Column 1", "Column 2"],
          "rows": [["Value 1", "Value 2"]]

        "question": "Question text",

        "answer": 0,
        "marks": 1,
        "negativeMarks": 0.25,
        "explanation": "Clear solution"
      }
    ]
  }
}

QUESTION RULES
- Use "mcq" for multiple-choice questions and "descriptive" for writing questions.
- The answer is a number: 0 means A, 1 means B, 2 means C, 3 means D and 4 means E.
- Give every question a different ID such as Q001, Q002 and Q003.

- Check that each answer number matches the correct option before returning the JSON.`;}
